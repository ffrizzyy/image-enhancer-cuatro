name: CI

on:
  push:
    branches: [main]
  pull_request:

# v1 targets Windows only; macOS/Linux are post-v1.
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm e2e
      - run: pnpm dist
      - run: node scripts/package-smoke.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: image-enhancer-win-unpacked
          path: apps/desktop/release/win-unpacked
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: image-enhancer-installer
          path: apps/desktop/release/*-setup.exe
          if-no-files-found: error
